# @package reward
name: hire
mode: contrastive
temperature: 10.0
contrastive_weight: 0.9
contrastive_weight_mode: fixed
contrastive_epsilon: 1.0e-6
use_positive: true
potential_scale: 1.0
shaping:
  pbrs: true
  discount: 0.99
  normalize: true
  normalizer: ${horizon_steps}
schedule:
  maximum: 1.0
  minimum: 0.0
  exponent: 1.0
  window: 100
  ema_decay: 0.95
  success_cap: 0.8
positive_buffer:
  buffer_path: ${oc.env:HIRE_DATA_DIR}/${benchmark}/${env_name}-img/ph_pretrain/${encoder.name}_positive_buffer.pt
  dataset_path: ${oc.env:HIRE_DATA_DIR}/${benchmark}/${env_name}-img/ph_pretrain/train.npz
  build_if_missing: true
  frame_stride: 5
  max_episodes: 0
  max_frames_per_episode: 0
  encode_batch_size: 64
  sample_batch_size: 12
  sampling_mode: uniform
  save_images_in_buffer: true
  build_wait_timeout_s: 7200
  build_wait_poll_s: 2.0
  online:
    enabled: true
    buffer_size: 128
    online_mix_ratio: 0.5
    add_mode: last_frame
    frame_stride: 5
    seed: 0
    store_images: true
negative_buffer:
  buffer_size: 128
  sample_batch_size: 12
  store_images: true
